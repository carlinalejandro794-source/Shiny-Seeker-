    <style>/* Hark's design tokens and component styles. Each component's rules follow its @component comment. style-gates: data */

/* @component foundations */
:root {
  color-scheme: light dark;

  --text-primary: light-dark(#1d1d1f, #f5f5f7);         /* body text */
  --text-secondary: light-dark(#636366, #a1a1a6);       /* supporting grey text */
  --text-tertiary: light-dark(#1d1d1f4d, #f5f5f74d);    /* hollow dots, faint marks; never body text */
  --text-primary-on: light-dark(#f5f5f7, #1d1d1f);      /* text on --fill-primary */
  --text-secondary-on: light-dark(#aeaeb2, #5c5c60);    /* grey text on --fill-primary */
  --fill-primary: light-dark(#1d1d1f, #f5f5f7);         /* the strong fill: solid chips, the nav, the badge */
  --fill-primary-on: light-dark(#f5f5f7, #1d1d1f);      /* the page background */
  --fill-secondary: light-dark(#1d1d1f80, #f5f5f780);
  --fill-tertiary: light-dark(#e8e8ea, #2a2a2d);        /* the grey card, panel and row tint */
  --fill-segment: light-dark(#3a3a3c, #e2e2e4);         /* the nav's tab track */
  --fill-system-green: #00a665;                         /* status: done, ready */
  --fill-system-orange: #ff4d00;                        /* status: now, current */
  --fill-system-red: light-dark(#da2f35, #f1555b);      /* status: blocked, error */
  --transparent-primary: light-dark(#1d1d1f4d, #f5f5f74d);
  --stroke-primary: light-dark(#1d1d1f24, #f5f5f724);   /* strong hairline */
  --stroke-secondary: light-dark(#1d1d1f12, #f5f5f712); /* faint hairline between rows */
  --stroke-primary-on: light-dark(#f5f5f71a, #1d1d1f1a);
  --stroke-composer: light-dark(#f5f5f780, #1d1d1f80);  /* the callout's glass edge */
  --stroke-system-orange: #ff4d0026;
  --hover-wash: light-dark(#1d1d1f0d, #f5f5f70d);
  --hover-wash-primary-on: light-dark(#f9f9fa26, #1d1d1f14);

  /* The hero is light text over a dark photo in both themes. */
  --hero-surface: #161f39;
  --hero-text: #f5f5f7;
  --hero-text-muted: #f5f5f7cc;
  --hero-scrim-strong: rgb(22 31 57 / 0.78);
  --hero-scrim-soft: rgb(22 31 57 / 0.3);
  --hero-scrim-side: rgb(22 31 57 / 0.45);
  --hero-glass: rgb(22 31 57 / 0.42);
  --hero-glass-faint: rgb(22 31 57 / 0.35);
  --hero-glass-stroke: rgb(245 245 247 / 0.28);

  --mat-regular: light-dark(rgb(255 255 255 / 0.56), rgb(29 29 31 / 0.55));
  --mat-thin: light-dark(rgb(255 255 255 / 0.22), rgb(29 29 31 / 0.4));
  --mat-agent: light-dark(rgb(255 255 255 / 0.84), rgb(29 29 31 / 0.66));
  --mat-inverse: color-mix(in srgb, var(--fill-primary) 86%, transparent);  /* the nav: dark on light, light on dark */
  --hark-blur: blur(50px) saturate(1.6);
  --hark-shadow: 0 8px 40px #1d1d1f1f;

  --sans: "GT Standard", "GT Standard L", "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --lh: 1.3;                                            /* every text style is 130% */
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-bold: 600;
  --size-caption: 12px;                                 /* the smallest text allowed */
  --size-meta: 13px;
  --size-small: 14px;
  --size-body: 15px;
  --size-prose: 16px;
  --size-heading: 20px;
  --size-figure: clamp(24px, 3vw, 32px);
  --size-title: clamp(26px, 3vw, 32px);
  --size-display: clamp(34px, 5vw, 48px);
  --size-lede: clamp(16px, 1.7vw, 20px);

  --type-caption: var(--weight-regular) var(--size-caption)/var(--lh) var(--sans);
  --type-tag: var(--weight-medium) var(--size-caption)/var(--lh) var(--sans);
  --type-small: var(--weight-regular) var(--size-small)/var(--lh) var(--sans);
  --type-label: var(--weight-medium) var(--size-small)/var(--lh) var(--sans);
  --type-body: var(--weight-regular) var(--size-body)/var(--lh) var(--sans);
  --type-body-strong: var(--weight-medium) var(--size-body)/var(--lh) var(--sans);
  --type-heading: var(--weight-medium) var(--size-heading)/var(--lh) var(--sans);
  --type-lede: var(--weight-medium) var(--size-lede)/var(--lh) var(--sans);
  --type-figure: var(--weight-regular) var(--size-figure)/var(--lh) var(--sans);
  --type-title: var(--weight-regular) var(--size-title)/var(--lh) var(--sans);
  --type-display: var(--weight-medium) var(--size-display)/var(--lh) var(--sans);
  --type-numeral: var(--weight-regular) 48px/1 var(--sans);

  --r-s: 12px;
  --r-m: 16px;
  --r-l: 24px;
  --r-xl: 32px;
  --r-pill: 100px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur-quick: 160ms;
  --dur-draw: 1400ms;

  --page-max: 1120px;
  --gutter: clamp(16px, 3vw, 32px);                     /* the page's side padding */
  --tap: 44px;                                          /* the smallest touch target */
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--fill-primary-on);
  color: var(--text-primary);
  font: var(--type-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
figure { margin-inline: 0; }
a { color: inherit; }
b, strong { font-weight: var(--weight-bold); }
p { margin: 0; text-wrap: pretty; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
small { font-size: max(var(--size-caption), 0.85em); }
.sub { color: var(--text-secondary); }

:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 3px; border-radius: 6px; }

/* @component page */
.page {
  max-width: var(--page-max);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 12px 40px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.glass {
  background: var(--mat-inverse);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  border: 1px solid var(--stroke-primary-on);
}
.nav {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  z-index: 20;
  justify-self: center;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  border-radius: var(--r-pill);
  box-shadow: var(--hark-shadow);
}
.nav :focus-visible { outline-color: var(--fill-primary-on); }
.seg {
  display: flex;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: var(--r-pill);
  background: var(--fill-segment);
}
.seg::-webkit-scrollbar { display: none; }
.seg a {
  flex: none;
  padding: 8px 14px;
  border-radius: var(--r-pill);
  font: var(--type-label);
  color: var(--text-secondary-on);
  text-decoration: none;
  white-space: nowrap;
}
.seg a:hover { color: var(--text-primary-on); }
/* The active tab carries its own fill so its text is measured against it. */
.seg a[aria-current="true"] { background: var(--fill-primary-on); color: var(--text-primary); }
.theme-btn {
  flex: none;
  width: 36px; height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--hover-wash-primary-on);
  color: var(--text-primary-on);
  cursor: pointer;
}
.theme-btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash-primary-on); }
.theme-btn::before { content: ""; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; background: linear-gradient(to right, light-dark(currentColor, transparent) 50%, light-dark(transparent, currentColor) 50%); }
@media (max-width: 599px) {
  .seg a { display: flex; align-items: center; min-height: var(--tap); }
  .theme-btn { width: var(--tap); height: var(--tap); }
}

/* @component footer */
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px 24px;
  padding-top: 24px;
  border-top: 1px solid var(--stroke-secondary);
  font-size: var(--size-small);
  color: var(--text-secondary);
}
.foot strong { color: var(--text-primary); }
.foot nav { display: flex; flex-wrap: wrap; gap: 6px; }
.foot nav a {
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--fill-tertiary);
  color: var(--text-primary);
  font: var(--type-tag);
  text-decoration: none;
}
.foot nav a:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--r-xl);
  background: var(--fill-primary);
  color: var(--text-primary-on);
  box-shadow: var(--hark-shadow);
  font: var(--weight-medium) var(--size-body)/1.1 var(--sans);
  text-decoration: none;
}
.badge:hover { box-shadow: var(--hark-shadow), inset 0 0 0 100px var(--hover-wash-primary-on); }
.hark-mark { display: inline-grid; place-items: center; }
.hark-mark svg { display: block; }
@media (max-width: 599px) {
  .foot nav a { display: inline-flex; align-items: center; min-height: var(--tap); min-width: var(--tap); }
  .badge { min-height: var(--tap); }
}

/* @component chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 8px;
  border-radius: var(--r-pill);
  font: var(--type-tag);
  max-width: 100%;
  background: var(--fill-tertiary);
  color: var(--text-secondary);
  vertical-align: middle;
}
.chip::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  flex: none;
  box-shadow: inset 0 0 0 1.5px var(--text-tertiary);
}
.chip--solid { background: var(--fill-primary); color: var(--text-primary-on); }
.chip--solid::before { background: var(--fill-system-green); box-shadow: none; }
td .chip { white-space: nowrap; }
/* @component dot */
.dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font: var(--type-tag);
  color: var(--text-primary);
}
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fill-system-green); }
tbody th .dot { display: flex; width: fit-content; }
/* @component pill */
.pill {
  display: inline-block;
  padding: 1px 8px;
  border-radius: var(--r-pill);
  background: var(--fill-tertiary);
  color: var(--text-secondary);
  font: var(--type-tag);
  white-space: normal;
  vertical-align: 1px;
}
/* @component button, link and links */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 5px 12px;
  border-radius: var(--r-s);
  background: var(--fill-primary-on);
  color: var(--text-primary);
  border: 1px solid var(--stroke-primary);
  font: var(--type-tag);
  text-decoration: none;
  max-width: 100%;
  transition: box-shadow var(--dur-quick) ease;
}
.btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
.btn[target="_blank"]::after { content: "\2197"; font-size: 11px; color: var(--text-secondary); }
.link {
  color: var(--text-primary);
  text-decoration: underline;
  text-decoration-color: var(--stroke-primary);
  text-underline-offset: 3px;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.link:hover { text-decoration-color: currentColor; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
@media (pointer: coarse), (max-width: 599px) { .btn { min-height: var(--tap); padding-inline: 14px; } }

/* A button that asks Hark is the page's primary capsule. Once it sends, Hark
   writes a check and "Sent to Hark" into it, and it turns secondary. */
.btn[data-hark-action] {
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--fill-primary);
  color: var(--text-primary-on);
  font: var(--type-body-strong);
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  transition: box-shadow var(--dur-quick) ease, transform var(--dur-quick) ease;
}
/* A state's message after the label is long, so a button saying one may wrap. */
.btn[data-hark-action][data-hark-state]:not([data-hark-state="sending"]) { white-space: normal; }
.btn[data-hark-action]:hover { box-shadow: inset 0 0 0 100px var(--hover-wash-primary-on); }
.btn[data-hark-action]:active { transform: scale(0.97); }
.btn[data-hark-action] svg { flex: none; }
.btn[data-hark-action][data-hark-state="sent"] { background: var(--fill-tertiary); color: var(--text-primary); box-shadow: none; }

/* The states before a press is sent. A CSS escape swallows the one space
   after it, so the dot is followed by a no-break space (\00a0), which also
   keeps the dot on its words' line. */
[data-hark-action][data-hark-state="sending"] { opacity: 0.6; pointer-events: none; }
[data-hark-action][data-hark-state="sent"] { pointer-events: none; cursor: default; }
[data-hark-action][data-hark-state]::after { color: var(--text-secondary); font-weight: 400; }
.btn[data-hark-action][data-hark-state]::after { color: var(--text-secondary-on); }
[data-hark-action][data-hark-state="sign_in"]::after { content: " \00b7\00a0Sign in to Hark to use this"; }
[data-hark-action][data-hark-state="not_allowed"]::after { content: " \00b7\00a0Only the page\2019s owner can use this"; }
[data-hark-action][data-hark-state="failed"]::after { content: " \00b7\00a0Did not send, try again"; }
@media (max-width: 599px) {
  .link { display: inline-flex; align-items: center; min-width: var(--tap); min-height: var(--tap); margin: -13px 0; vertical-align: middle; }
}
/* @component text and fineprint */
.prose { display: grid; gap: 12px; max-width: 68ch; font-size: var(--size-prose); }
.fineprint { font-size: var(--size-small); color: var(--text-secondary); max-width: 70ch; }
/* @component hero */
.hero {
  position: relative;
  min-height: clamp(320px, 46vh, 480px);
  border-radius: var(--r-xl);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  color: var(--hero-text);
  isolation: isolate;
  box-shadow: var(--hark-shadow);
  background: var(--hero-surface);
}
/* Without a photo the hero is as tall as its copy, so the callout sits beside the copy instead of over it. */
.hero:not(:has(.hero__img)) { min-height: 0; background: var(--hero-surface) center / cover no-repeat; }
.hero:not(:has(.hero__img))::after { background: linear-gradient(to right, var(--hero-scrim-side) 0%, transparent 60%); }
@media (min-width: 761px) {
  .hero:not(:has(.hero__img)) > .callout { position: static; flex: none; align-self: flex-start; margin: clamp(16px, 2.4vw, 24px) clamp(16px, 2.4vw, 24px) clamp(16px, 2.4vw, 24px) auto; }
}
.hero__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 40% 60%;
  z-index: -2;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(to top, var(--hero-scrim-strong) 0%, var(--hero-scrim-soft) 42%, transparent 66%),
    linear-gradient(to right, var(--hero-scrim-side) 0%, transparent 60%);
}
.hero__copy {
  display: grid;
  gap: 14px;
  max-width: 40rem;
  padding: clamp(24px, 4vw, 48px);
  padding-bottom: clamp(28px, 3.4vw, 44px);
}
.hero__eyebrow {
  justify-self: start;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--hero-glass);
  border: 1px solid var(--hero-glass-stroke);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  font: var(--type-label);
}
.hero h1 { font: var(--type-display); letter-spacing: 0; }
.hero h1 em { font-style: normal; }
.hero__sub { font: var(--type-lede); max-width: 34ch; }
.hero__meta { font-size: var(--size-small); color: var(--hero-text-muted); }
.hero__credit {
  position: absolute;
  right: clamp(20px, 3vw, 32px);
  bottom: 16px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: var(--hero-glass-faint);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  font: var(--type-caption);
  color: var(--hero-text-muted);
}
/* A callout overlays the photo's top corner, so the hero keeps room for it above the copy. */
@media (min-width: 761px) { .hero:has(> .callout) { min-height: clamp(420px, 56vh, 560px); } }
.hero > .callout {
  position: absolute;
  top: clamp(16px, 2.4vw, 24px);
  right: clamp(16px, 2.4vw, 24px);
  width: min(320px, calc(100% - 32px));
}
@media (max-width: 760px) {
  .hero { flex-direction: column; justify-content: flex-end; align-items: stretch; min-height: 0; }
  .hero__img { object-position: 22% 50%; }
  .hero__copy { padding-top: 140px; padding-bottom: 28px; }
  .hero:not(:has(.hero__img)) .hero__copy { padding-top: clamp(24px, 4vw, 48px); }
  .hero__credit { top: 16px; right: 16px; bottom: auto; }
  .hero > .callout { position: static; width: auto; margin: 0 12px 12px; }
}
/* On a phone the title starts higher, so the first screen reaches the stats. */
@media (max-width: 599px) { .hero__copy { padding-top: 88px; padding-bottom: 20px; } }
/* @component callout */
.callout {
  max-width: 420px;
  display: grid;
  gap: 10px;
  padding: 16px 18px 18px;
  border-radius: var(--r-l);
  background: var(--mat-agent);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  border: 1px solid var(--stroke-composer);
  box-shadow: var(--hark-shadow);
  color: var(--text-primary);
  font-size: var(--size-small);
}
.callout__head { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-weight: var(--weight-medium); }
.callout__head svg { color: var(--text-primary); }
.callout__lead { font-size: var(--size-body); }
.callout .fineprint { font-size: var(--size-caption); }
.callout .btn { justify-self: start; }
/* @component stats */
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding-top: 8px; }
.stat {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 4px;
  padding: 12px 24px;
  border-left: 1px solid var(--stroke-secondary);
}
.stat:first-child { border-left: 0; padding-left: 0; }
.stat__fig { font: var(--type-figure); font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--size-small); color: var(--text-secondary); }
@media (max-width: 760px) {
  .stats { grid-auto-flow: row; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; padding-top: 0; }
  .stat { grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; gap: 12px; padding: 14px 0; border-left: 0; border-top: 1px solid var(--stroke-secondary); }
  .stat:first-child { border-top: 0; }
}
/* On a phone the stats sit two to a row, figure over label. */
@media (max-width: 599px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 0; }
  .stat { grid-column: auto; grid-template-columns: none; gap: 2px; padding: 12px 0; }
  .stat:nth-child(2) { border-top: 0; }
  .stat:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--stroke-secondary); }
  .stat__fig { font-size: 26px; line-height: 1.15; }
  .stat__label { font-size: var(--size-caption); }
}
/* @component section */
.section {
  padding-block: clamp(40px, 6vw, 72px) clamp(16px, 2vw, 24px);
  border-top: 1px solid var(--stroke-secondary);
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); /* Clears the sticky .nav: its top offset plus its tallest height, 56px. */
  min-width: 0;
}
.section > * + * { margin-top: clamp(20px, 2.4vw, 28px); }
.section > .head + * { margin-top: 0; }
.head {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 10px 40px;
  align-items: end;
  margin-bottom: clamp(24px, 3vw, 36px);
}
.head__eyebrow { grid-column: 1 / -1; font: var(--type-label); color: var(--text-secondary); }
.head h2 { font: var(--type-title); }
.head__sub { justify-self: end; font-size: var(--size-body); color: var(--text-secondary); max-width: 44ch; text-align: right; }
@media (max-width: 900px) { .head { grid-template-columns: 1fr; } .head__sub { justify-self: start; text-align: left; } }
/* @component table */
.table-wrap { margin-inline: -12px; padding-inline: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font: var(--type-small); font-variant-numeric: tabular-nums; }
caption { text-align: left; font: var(--type-caption); color: var(--text-secondary); padding: 0 0 10px; }
th, td { text-align: left; vertical-align: top; padding: 12px; border-bottom: 1px solid var(--stroke-secondary); }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
thead th {
  font: var(--type-tag);
  color: var(--text-secondary);
  border-bottom-color: var(--stroke-primary);
  padding-top: 0;
  padding-bottom: 8px;
  white-space: nowrap;
}
tbody th { font-weight: var(--weight-bold); }
tbody tr:last-child > * { border-bottom: 0; }
.rowhead { white-space: nowrap; }
td small, th small { display: block; font: var(--type-caption); color: var(--text-secondary); margin-top: 2px; }
td.num { font-weight: var(--weight-bold); white-space: nowrap; }
td.num small { white-space: normal; }
.muted { color: var(--text-secondary); }
tr.is-highlight > * { background: var(--fill-tertiary); }
tr.is-highlight > :first-child { box-shadow: -12px 0 var(--fill-tertiary); }
tr.is-highlight > :last-child { box-shadow: 12px 0 var(--fill-tertiary); }
.after-table { margin-top: 20px; padding-inline: 12px; }
@media (max-width: 599px) {
  .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap th, .table-wrap td { display: block; }
  .table-wrap thead { display: none; }
  .table-wrap caption { display: block; text-align: left; }
  /* A row is its name on top, then its cells wrapped three or four to a line, each label over its value. */
  .table-wrap tbody tr { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid var(--stroke-secondary); }
  .table-wrap tbody tr.is-highlight { margin-inline: -12px; padding-inline: 12px; background: var(--fill-tertiary); }
  .table-wrap tbody tr.is-highlight > * { background: none; box-shadow: none; }
  .table-wrap tbody tr > * { border-bottom: 0; padding: 0; }
  .table-wrap tbody tr > th { flex: 1 0 100%; }
  .table-wrap tbody td.is-empty { display: none; }
  .table-wrap tbody td[data-label]::before { content: attr(data-label); display: block; color: var(--text-secondary); font-size: var(--size-caption); font-weight: var(--weight-regular); line-height: 1.3; }
  .table-wrap tbody td:has(> .link:only-child) { align-self: end; }
  .table-wrap tbody td:has(> .link:only-child)::before { display: none; }
  .rowhead { white-space: normal; }
}
/* @component compare */
.compare { margin-inline: -12px; overflow-x: auto; scroll-snap-type: x mandatory; }
.compare table { table-layout: fixed; min-width: calc(var(--compare-cols, 3) * 200px); }
.compare th, .compare td { scroll-snap-align: start; padding-inline: 12px; }
.compare thead th { font: var(--type-body-strong); color: var(--text-primary); white-space: normal; padding-top: 0; padding-bottom: 14px; border-bottom-color: var(--stroke-secondary); }
/* On light tiles a white product backdrop blends into the grey. */
.compare__media { position: relative; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; width: 100%; aspect-ratio: 4 / 3; max-height: 240px; margin: 0 0 12px; padding: 16px; border-radius: var(--r-m); background: var(--fill-tertiary); }
.compare__media img { max-width: 100%; max-height: 100%; mix-blend-mode: multiply; }
/* A photo of a place or a room fills its frame instead of fitting whole. */
.compare .compare__media.compare__media--photo { padding: 0; overflow: hidden; background: var(--fill-tertiary); }
.compare .compare__media.compare__media--photo img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; mix-blend-mode: normal; }
.compare thead th > .chip { display: flex; width: fit-content; margin-top: 8px; }
.compare:has(.compare__media) thead th:not(:has(.compare__media))::before { content: ""; display: block; width: 100%; aspect-ratio: 4 / 3; max-height: 240px; margin-bottom: 12px; border-radius: var(--r-m); background: var(--fill-tertiary); }
:root[data-theme="dark"] .compare__media img { mix-blend-mode: normal; border-radius: var(--r-s); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .compare__media img { mix-blend-mode: normal; border-radius: var(--r-s); } }
/* The header column shrinks to nothing on screen but stays in the table, so screen readers keep each value's row header. */
.js .compare tbody th[scope="row"], .js .compare thead td:first-child { width: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.js .compare td[data-label]::before { content: attr(data-label); content: attr(data-label) / ""; display: block; margin-bottom: 4px; font: var(--type-caption); color: var(--text-secondary); }
/* On a phone two options show side by side, and the rest are a swipe away. */
@media (max-width: 599px) { .compare table { min-width: calc(var(--compare-cols, 3) * 46vw); } .compare th, .compare td { padding-inline: 8px; } }
/* @component steps */
.step {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr) minmax(220px, 0.78fr);
  gap: 16px 28px;
  padding: 28px 0;
  border-bottom: 1px solid var(--stroke-secondary);
}
.step > * { min-width: 0; }
.steps > .step:last-child { border-bottom: 0; }
.step p + p { margin-top: 8px; }
.step__num { font: var(--type-numeral); color: var(--text-primary); font-variant-numeric: tabular-nums; }
.step__eyebrow { margin-top: 8px; font: var(--type-label); color: var(--text-secondary); }
.step h3 { font: var(--type-heading); margin-bottom: 12px; }
.step__pills { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.step__pills li {
  padding: 4px 10px;
  border-radius: var(--r-pill);
  border: 1px solid var(--stroke-primary);
  font-size: var(--size-meta);
  color: var(--text-secondary);
  max-width: 100%;
}
.step__pills b { color: var(--text-primary); font-weight: var(--weight-bold); }
.step__panel {
  align-self: start;
  margin: 0;
  padding: 16px 18px;
  border-radius: var(--r-m);
  background: var(--fill-tertiary);
  font-size: var(--size-small);
}
.step__panel dt { font-size: var(--size-caption); color: var(--text-secondary); margin-bottom: 2px; }
.step__panel dd { margin: 0 0 12px; }
.step__panel dd:last-child { margin-bottom: 0; }
.step__panel .fineprint { display: block; margin-top: 6px; font-size: var(--size-caption); }
.step__panel .btn { margin-top: 8px; }
.step__figure { grid-column: 2 / span 2; margin: 0; }
.step__figure img { width: 100%; height: clamp(200px, 26vw, 320px); object-fit: cover; border-radius: var(--r-m); }
.step__figure figcaption { font-size: var(--size-caption); color: var(--text-secondary); padding-top: 10px; }
@media (min-width: 901px) {
  .step:not(:has(> .step__panel)) { grid-template-columns: 112px minmax(0, 1fr); }
  .step:not(:has(> .step__panel)) > .step__figure { grid-column: 2; }
}
@media (max-width: 900px) {
  .step { grid-template-columns: minmax(0, 1fr); gap: 14px; }

  .step__num { font-size: 40px; }
  .step__eyebrow { margin-top: 0; }
}
/* @component checklist */
.checklist { display: grid; grid-template-columns: minmax(0, 1.4fr) auto minmax(0, 1fr); column-gap: 20px; list-style: none; margin: 0; padding: 0; }
.checklist:not(:has(.checklist__note)) { grid-template-columns: minmax(0, 1fr) auto; }
.checklist > li {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  row-gap: 8px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--stroke-secondary);
}
.checklist > li:last-child { border-bottom: 0; }
.checklist__item { grid-column: 1; font-weight: var(--weight-bold); }
.checklist > li > .chip { grid-column: 2; justify-self: start; }
.checklist:not(:has(.checklist__note)) > li > .chip { justify-self: end; }
.checklist__item small { display: block; font-weight: var(--weight-regular); font-size: var(--size-caption); color: var(--text-secondary); margin-top: 2px; }
.checklist__note { grid-column: 3; font-size: var(--size-small); color: var(--text-secondary); }
.checklist > li.is-done .checklist__item { text-decoration: line-through; text-decoration-color: var(--text-tertiary); }
/* A row's own button sits in a last column, so each booking is pressed where it is listed. */
.checklist:has(> li > .btn) { grid-template-columns: minmax(0, 1.4fr) auto minmax(0, 1fr) auto; }
.checklist:has(> li > .btn):not(:has(.checklist__note)) { grid-template-columns: minmax(0, 1fr) auto auto; }
.checklist > li > .btn { grid-column: -2; justify-self: end; }

  .checklist__note { grid-column: 1 / -1; }

  .checklist > li > .btn { grid-column: 2; justify-self: end; }

/* @component breakdown */
.breakdown { max-width: 720px; }

.timeline { display: grid; grid-template-columns: 210px minmax(0, 1fr) auto; column-gap: 28px; list-style: none; margin-inline: 0; margin-bottom: 0; padding: 0; }
.timeline > li {
  display: grid;

  grid-template-columns: subgrid;

  padding: 18px 0;
  border-bottom: 1px solid var(--stroke-secondary);
}
.timeline > li:first-child { padding-top: 0; }
.timeline > li:last-child { border-bottom: 0; padding-bottom: 0; }

    <style>
      :root { color-scheme: light; --sans: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; --x-teal: #0e6f73; --x-teal-2: #12a39d; --x-mint: #e3f8fb; --x-aqua: #a8ecf5; --x-ink: #0b4f52; --x-card: #fff; --x-green: #2e7d32; --x-green-bg: #e3f6e5; }
      /* Light app theme: pale aqua to white, no animated background. */
      html { background: #fff linear-gradient(180deg, #e3f8fb 0%, #ffffff 100%) fixed; }
      body { background: transparent; min-height: 100vh; font-family: var(--sans); }
      #view > .x-hint { background: #fff; border-radius: var(--r-s); padding: 10px 14px !important; margin: 0 0 12px; color: var(--text-primary); }
      .page { padding-top: 0; }
      .x-app { max-width: 560px; margin: 0 auto; padding: 72px var(--gutter) calc(96px + env(safe-area-inset-bottom)); }
      body[data-view="hunt"] .x-app { padding-top: 0; }
      /* App bar */
      .x-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px; padding-top: env(safe-area-inset-top); background: #a8ecf5; color: #0b4f52; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
      .x-bar h1 { flex: 1; margin: 0 0 0 4px; font: 500 20px/1.2 var(--sans); color: #0b4f52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .x-bar button { display: grid; place-items: center; width: 48px; height: 48px; border: 0; border-radius: 50%; background: none; color: #0b4f52; font: 22px/1 var(--sans); cursor: pointer; }
      .x-bar button:hover { background: #0b4f5214; }
      .x-bar .x-star { display: grid; place-items: center; width: 48px; height: 48px; color: var(--x-teal); font-size: 22px; }
      body[data-view="hunt"] .x-bar, body[data-view="setup"] .x-bar, body[data-view="hunt"] .x-tabs, body[data-view="setup"] .x-tabs { display: none; }
      /* Screen app bar (hunt + text setup): same aqua bar, back arrow, title, action */
      .x-abar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; gap: 4px; height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0; box-sizing: border-box; background: #a8ecf5; color: #0b4f52; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
      .x-abar h1 { flex: 1; min-width: 0; margin: 0 0 0 4px; font: 500 20px/1.2 var(--sans); color: #0b4f52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .x-abar button { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%; background: none; color: #0b4f52; font: 22px/1 var(--sans); cursor: pointer; }

          // Up to 4 equal bands, each with a little overlap so a line cut at a border still reads
          const nb = clamp(Math.round(chh / cw / 0.08), 2, 4), bi = D.band = ((D.band || 0) + 1) % nb, bh = chh / nb, ov = bh * 0.15;
          const y0 = Math.max(0, Math.floor(bi * bh - ov)), y1 = Math.min(chh, Math.ceil((bi + 1) * bh + ov));
          rc = D.bc || (D.bc = document.createElement("canvas")); rc.width = cw; rc.height = Math.max(1, y1 - y0);
          rc.getContext("2d").drawImage(c, 0, y0, cw, y1 - y0, 0, 0, cw, y1 - y0);
        }
        const pv = $("#pvw");
        if (pv) { pv.hidden = false; const ph = Math.max(8, Math.round((120 * rc.height) / rc.width)); if (pv.height !== ph) pv.height = ph; pv.width = 120; pv.getContext("2d").drawImage(rc, 0, 0, 120, ph); }
        const w = D.worker, prm = D.psm === psm ? Promise.resolve() : w.setParameters({ tessedit_pageseg_mode: psm }).then(() => { D.psm = psm; });
        prm.then(() => w.recognize(rc)).then((r) => {
          D.busy = false; if (!D.on || D.hid !== h.id) return;
          const now = Date.now(); D.reads.push(now);
          const t = r.data.text.replace(/\s+/g, " ").trim(); D.last = t || "(nothing — move closer, hold steady, avoid glare)";
          // Read the selection fresh from the current hunt state on every read, never a copy from scan start
          const ch = hunt(D.hid), ca = ch ? autoCfg(ch) : null, sel = ca && Array.isArray(ca.sel) ? ca.sel.slice() : [];
          if (!ch || ch.done) return scanUI();
          if (!sel.length) { D.last = "No keywords selected"; D.absent += 1; if (D.arm !== "ready" && now >= D.cdUntil) D.arm = "ready"; return scanUI(); }
          // Garbage filter: fewer than 2 letters, or under 50% letters/spaces, is noise and never matches
          const lt = (t.toLowerCase().match(/[a-z]/g) || []).length, ls = (t.toLowerCase().match(/[a-z\s]/g) || []).length;
          const junk = lt < 2 || ls / Math.max(1, t.length) < 0.5;
          if (junk && t) D.last = t + " (ignored: noise)";
          const m = junk ? null : findKw(t, sel, ca.strict === true);
          D.absent = m ? 0 : D.absent + 1;
          // Confirmation: the same keyword must appear in 2 consecutive reads within 1.5 s before it counts
          if (m && D.arm === "ready") {
            if (D.pend && D.pend.k === m && now - D.pend.t <= 1500) { D.pend = null; return hit(h, a, `Text "${m}"`); }
            D.pend = { k: m, t: now };
          } else D.pend = null;
          // Re-arm only after 2+ reads without the keyword AND the cooldown has passed
          if (D.arm !== "ready" && now >= D.cdUntil) D.arm = D.absent >= 2 ? "ready" : "waiting";
          scanUI();
        }).catch(() => { D.busy = false; });
      }

      // ---------- Controller (Gamepad API) ----------
      const BTN = ["A", "B", "X", "Y", "L1", "R1", "L2", "R2", "Select", "Start", "L3", "R3", "Up", "Down", "Left", "Right", "Home"];
      const PAD_ACTS = [["plus", "+count", "Adds the hunt's multiplier"], ["minus", "−1", "Removes one encounter"], ["found", "Shiny found", "Marks the hunt complete"], ["go", "Go! / Stop", "Starts or stops detection"], ["timer", "Start / Pause", "Toggles the hunt timer"]];
      const G = { raf: 0, prev: {}, wait: null, until: 0, waitT: 0 };
      const btnName = (i) => "Button " + i + (BTN[i] ? " (" + BTN[i] + ")" : "");
      const btnShort = (i) => BTN[i] || "Button " + i;
      function pads() {
        let l = [];
        try { l = navigator.getGamepads ? Array.prototype.slice.call(navigator.getGamepads() || []) : []; } catch (e) { l = []; }
        return l.filter((p) => p && p.connected !== false);
      }
      function padTarget() {
        const open = ui.view === "hunt" && hunt(ui.cur);
        return open || S.hunts.find((h) => !h.done) || null;
      }
      function actLabel(k, h) {
        if (k === "plus") return "+" + (h ? (+h.mult).toFixed(1) : "count");
        if (k === "minus") return "−1";
        if (k === "found") return "Shiny found";
        if (k === "go") return h && D.on && D.hid === h.id ? "Stop" : "Go!";
        return h && h.runSince ? "Pause" : "Start";
      }
      function vController() {
        const list = pads(), b = S.settings.bindings || {}, h = padTarget();
        const padHtml = list.length ? `<ul class="x-cc__pads">${list.map((p) => `<li><b aria-label="Connected">✓</b><span>${esc(p.id)}${p.mapping === "standard" ? "" : " · non-standard layout"}</span></li>`).join("")}</ul>` : `<p class="x-cc__none">No controller connected — press any button on your controller</p>`;
        const chips = PAD_ACTS.filter(([k]) => b[k] != null).map(([k]) => `<li>${esc(btnShort(b[k]) + " → " + actLabel(k, h))}</li>`).join("");
        const rows = PAD_ACTS.map(([k, name, sub]) => {
          const waiting = G.wait === k, has = b[k] != null;
          return `<div class="x-bind"><div><b>${name}</b><span>${waiting ? "Press a controller button…" : has ? esc(btnName(b[k]) + " → " + actLabel(k, h)) : sub + " · not bound"}</span></div>
            <button type="button" class="x-btn${waiting ? " is-wait" : ""}" data-pad="bind" data-key="${k}">${waiting ? "Waiting…" : "Bind"}</button>
            ${has ? `<button type="button" class="x-btn x-btn--ghost" data-pad="clear" data-key="${k}">Clear</button>` : "<span></span>"}</div>`;
        }).join("");
        const modal = !ui.padMap ? "" : `<div class="x-modal" id="padMap" data-pad="unmap"><div class="x-sheet" role="dialog" aria-modal="true" aria-label="Counter mappings">
            <p class="x-sec">⚙ Counter Mappings</p>
            <p class="x-hint" style="margin:0 0 6px">Tap Bind, then press a controller button within 5 seconds. Buttons act on ${h ? `<b>${esc(h.name)}</b>` : "the open hunt, or your most recent active hunt"}.</p>
            ${rows}
            <button type="button" class="x-btn x-cc__done" data-pad="unmap">Done</button></div></div>`;
        return `<header class="x-abar">
            <button type="button" data-tab="hunts" aria-label="Back to My Hunts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
            <h1>Controller</h1></header>
          <div class="x-cc x-cc--green"><h2><span aria-hidden="true">⊕</span> Counter Mapping</h2>
            <p>Assign controller buttons to increment the hunt counter. Example: R1 → +1.0</p>
            ${chips ? `<ul class="x-cc__chips" aria-label="Current mappings">${chips}</ul>` : ""}
            <button type="button" class="x-cc__go" data-pad="map"><span aria-hidden="true">⚙</span> Configure Counter Mappings</button></div>
          <div class="x-cc x-cc--blue"><div class="x-cc__head"><h2>Connected Controllers</h2>
            <button type="button" class="x-cc__ref" data-pad="refresh" aria-label="Refresh controllers">⟳</button></div>${padHtml}</div>
          <div class="x-cc x-cc--grey"><p>Modded 3DS control (IP connection, input redirection, button sequences) needs the native Android app — a web page can't talk to a 3DS.</p></div>
          ${modal}`;
      }
      function padFire(k, i) {
        const h = padTarget();
        if (!h) return toast("🎮 No active hunt — create one first");
        const label = actLabel(k, h);
        if (k === "plus") { if (h.done) return toast("🎮 This hunt is completed"); ACT.plus(h); return snack(`Controller button pressed (+${(+h.mult).toFixed(2)}) - Reset Count: ${rcount(h.count)}`); }
        else if (k === "minus") { if (h.count <= 0) return toast("Count is already 0"); buzz(15); setCount(h, h.count - 1); }
        else if (k === "found") { if (h.done) return toast("🎮 Already found"); ACT.found(h); }
        else if (k === "timer") ACT.timer(h);
        else if (k === "go") {
          if (h.done) return toast("🎮 This hunt is completed");
          if (D.on) { const same = D.hid === h.id; stopScan(); if (same) return toast("🎮 " + btnShort(i) + " → Stop"); }
          if (ui.view !== "hunt" || ui.cur !== h.id) go("hunt", h.id);
          h.auto ? camSetup(h) : textSetup(h, true);
        }
        toast("🎮 " + btnShort(i) + " → " + label);
      }
      function padEndWait(msg) { G.wait = null; clearTimeout(G.waitT); if (msg) toast(msg); if (ui.view === "controller") render(); }
      function padPoll() {
        G.raf = 0;
        const list = pads(); if (!list.length) { G.prev = {}; return; }
        if (G.wait && Date.now() > G.until) padEndWait("No button pressed — try Bind again");
        list.forEach((p) => {
          const prev = G.prev[p.index] || [], now = (p.buttons || []).map((b) => !!(b && (b.pressed || b.value > 0.5)));
          G.prev[p.index] = now;
          now.forEach((on, i) => {
            if (!on || prev[i]) return; // press edge only
            if (G.wait) { const k = G.wait; S.settings.bindings[k] = i; save(); padEndWait("🎮 " + btnName(i) + " → " + actLabel(k, padTarget())); return; }
            if ($("#askBox") || $("#shiny")) return;
            const b = S.settings.bindings || {};
            PAD_ACTS.forEach(([k]) => { if (b[k] === i) safe(padFire, "pad")(k, i); });
          });
        });
        G.raf = requestAnimationFrame(safe(padPoll, "pad", true));
      }
      function padStart() { if (!G.raf && pads().length) G.raf = requestAnimationFrame(safe(padPoll, "pad", true)); }
      function padChanged(e) {
        if (e && e.type === "gamepadconnected" && e.gamepad) toast("🎮 Connected: " + String(e.gamepad.id).slice(0, 40));
        if (e && e.type === "gamepaddisconnected" && e.gamepad) { delete G.prev[e.gamepad.index]; toast("🎮 Controller disconnected"); }
        padStart();
        if (ui.view === "controller") render();
      }
      window.addEventListener("gamepadconnected", safe(padChanged, "pad", true));
      window.addEventListener("gamepaddisconnected", safe(padChanged, "pad", true));
      document.addEventListener("click", safe((e) => {
        const t = e.target && e.target.closest && e.target.closest("[data-pad]"); if (!t) return;
        const k = t.dataset.key, cmd = t.dataset.pad;
        if (cmd === "map") { ui.padMap = true; render(); const s = $("#padMap [data-pad='bind']"); if (s) try { s.focus(); } catch (er) {} return; }
        if (cmd === "unmap") { if (t.id === "padMap" && e.target !== t) return; ui.padMap = false; if (G.wait) padEndWait(); else render(); return; }
        if (cmd === "refresh") { padStart(); render(); return toast(pads().length ? `🎮 ${pads().length} controller${pads().length > 1 ? "s" : ""} found` : "No controllers yet — press any button on yours"); }
        if (cmd === "clear") { delete S.settings.bindings[k]; save(); return render(); }
        if (cmd === "bind") {
          if (G.wait === k) return padEndWait();
          if (!pads().length) return toast("Connect a controller first — press any button on it");
          G.wait = k; G.until = Date.now() + 5000; clearTimeout(G.waitT);
          G.waitT = setTimeout(safe(() => { if (G.wait) padEndWait("No button pressed — try Bind again"); }, "pad", true), 5100);
          // Ignore buttons already held when binding starts
          pads().forEach((p) => { G.prev[p.index] = (p.buttons || []).map((b) => !!(b && (b.pressed || b.value > 0.5))); });
          padStart(); render();
        }
      }, "pad"));
      document.addEventListener("keydown", safe((e) => {
        if (e.key !== "Escape" || !ui.padMap || ui.view !== "controller" || $("#askBox")) return;
        ui.padMap = false; if (G.wait) padEndWait(); else render();
      }, "pad"));

      // Live timers
      setInterval(safe(() => {
        const h = ui.view === "hunt" && hunt(ui.cur), el = $("#tmr");
        if (h && el && h.runSince) el.textContent = fmtHM(elapsed(h));
      }, "clock", true), 1000);

      // Pokémon list for autocomplete. Optional: any failure, timeout or offline state just leaves the list empty.
      function dexFail(e) {
        DEXFAIL = true; if (e) oops(e, "PokeAPI", true);
        const note = $("#dexNote"); if (note) note.textContent = "Couldn't load the Pokémon list — type any name, or the dex number for a sprite.";
      }
      function dexOk(d) {
        if (!d || !Array.isArray(d.results)) return dexFail(new Error("bad PokeAPI data"));
        const opts = [];
        d.results.forEach((p) => {
          if (!p || !p.name || !p.url) return;
          const n = parseInt(String(p.url).split("/").filter(Boolean).pop(), 10), name = cap(p.name);
          if (!(n >= 1) || !name) return;
          DEX[name.toLowerCase()] = n; opts.push(`<option value="${esc(name)}">#${n}</option>`);
        });
        const dl = $("#dexList"); if (dl) dl.innerHTML = opts.join("");
        const note = $("#dexNote"); if (note) note.textContent = "";
      }
      function loadDex() {
        try {
          if (typeof fetch !== "function") return dexFail(new Error("fetch unavailable"));
          if (navigator.onLine === false) return dexFail();
          const ctl = typeof AbortController === "function" ? new AbortController() : null;
          let doneFlag = false;
          const to = setTimeout(() => { if (doneFlag) return; doneFlag = true; try { if (ctl) ctl.abort(); } catch (e) {} dexFail(new Error("PokeAPI timeout")); }, 8000);
          fetch("https://pokeapi.co/api/v2/pokemon-species?limit=1025", ctl ? { signal: ctl.signal } : undefined)
            .then((r) => { if (!r || !r.ok) throw new Error("PokeAPI HTTP " + (r && r.status)); return r.json(); })
            .then((d) => { if (doneFlag) return; doneFlag = true; clearTimeout(to); try { dexOk(d); } catch (e) { dexFail(e); } })
            .catch((e) => { if (doneFlag) return; doneFlag = true; clearTimeout(to); dexFail(e); });
        } catch (e) { dexFail(e); }
      }

      try { render(); } catch (e) { oops(e, "init"); }
      try { loadDex(); } catch (e) { dexFail(e); }
      try { padStart(); } catch (e) { oops(e, "pad", true); }
    </script>
  

</body></html>
